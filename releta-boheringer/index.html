<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boehringer Ingelheim — Ruleta Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>

/* ================================================================
   VARIABLES
================================================================ */
:root {
  --bg:       #0d302a;
  --green:    #58b46e;
  --green-dk: #3dbf6a;
  --white:    #ffffff;
  --correct:  #3dbf6a;
  --wrong:    #e05252;
  --font:     'DM Sans', system-ui, sans-serif;
  --font-d:   'DM Serif Display', Georgia, serif;
  --slide-t:  0.65s;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:var(--font);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

#app { position:fixed; inset:0; overflow:hidden; }

/* ── SLIDE SYSTEM ───────────────────────── */
.screen {
  position:absolute; inset:0;
  will-change:transform;
  transition:transform var(--slide-t) cubic-bezier(0.77,0,0.175,1);
}
#scr-wheel    { transform:translateX(0%); }
#scr-question { transform:translateX(100%); }
#app.show-q #scr-wheel    { transform:translateX(-100%); }
#app.show-q #scr-question { transform:translateX(0%); }

/* ================================================================
   PANTALLA 1 — RULETA
================================================================ */
#scr-wheel {
  background: var(--bg);
  overflow: hidden;
}

/* Glow sutil */
#scr-wheel::before {
  content:'';
  position:absolute; inset:0;
  background: radial-gradient(ellipse 70% 60% at 65% 50%,
    rgba(88,180,110,0.07) 0%, transparent 70%);
  pointer-events:none;
}

/* — Logo título — */
.logo-wrap {
  position:absolute; top:4%; right:4%; z-index:20;
}
.logo-wrap img {
  height: clamp(50px, 8vh, 110px);
  width: auto;
  display:block;
}

/* — Wheel wrapper — */
.wheel-wrap {
  position:absolute;
  top:50%; left:-18%;
  transform:translateY(-50%);
  width: clamp(320px, 88vmin, 1050px);
  aspect-ratio:1/1;
  cursor:pointer;
  user-select:none; -webkit-user-select:none;
  z-index:10;
}

/* Capas del wheel (todas absolute, llenan el wrapper) */
.wheel-layer {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  display:block; object-fit:contain;
}

/* Capa giratoria */
#wheel-spin {
  transform-origin: 50% 50%;
  /* transition se asigna en JS */
}

/* Puntero (fuera del SVG, pegado a la derecha del wrapper) */
.wheel-pointer {
  position:absolute;
  right: -5%;
  top:50%; transform:translateY(-50%);
  width:10%;
  pointer-events:none; z-index:15;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.35));
}

/* — Dog + piso — */
.dog-wrap {
  position:absolute;
  bottom:0; right:3%;
  width: clamp(100px, 21vw, 290px);
  pointer-events:none; z-index:5;
  display:flex; flex-direction:column;
}
.dog-wrap video { display:block; width:100%; flex-shrink:0; }
.dog-floor      { display:block; width:100%; flex-shrink:0; }

/* — Tap hint — */
.tap-hint {
  position:absolute; top:50%; right:5%;
  transform:translateY(-50%);
  color:rgba(255,255,255,0.5);
  font-size:clamp(0.8rem,1.8vh,1.2rem); font-weight:500;
  pointer-events:none; text-align:center; line-height:1.7;
  transition:opacity 0.5s;
  animation:breathe 2.5s ease-in-out infinite;
}
@keyframes breathe {
  0%,100%{opacity:.45;} 50%{opacity:.95;}
}

/* ================================================================
   PANTALLA 2 — PREGUNTAS
================================================================ */
#scr-question {
  background: linear-gradient(to right,
    var(--green)  0%,
    #1a5c46      28%,
    var(--bg)    50%,
    var(--bg)   100%);
  overflow-y:auto; overflow-x:hidden;
}

/* Patrón punteado sutil */
#scr-question::before {
  content:''; position:absolute; inset:0;
  background-image: radial-gradient(circle, rgba(88,180,110,0.06) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none; z-index:0;
}

.q-content {
  position:relative; min-height:100%;
  display:flex; flex-direction:column; justify-content:center;
  padding: 7% 9% 20% 9%;
  gap: clamp(12px, 2.2vh, 30px);
  z-index:1;
}

/* Badge número */
.q-badge { display:flex; align-items:center; gap:14px; }

.q-num-circle {
  width: clamp(44px,7vh,82px); height: clamp(44px,7vh,82px);
  background:var(--green); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.1rem,3.5vh,2.2rem); font-weight:800; color:white;
  flex-shrink:0;
  box-shadow:0 0 0 4px rgba(88,180,110,0.25);
}
.q-label-txt {
  text-transform:uppercase; letter-spacing:3px;
  color:rgba(255,255,255,0.55);
  font-size:clamp(0.7rem,1.6vh,1rem); font-weight:600;
}

/* Texto de la pregunta */
.q-text {
  color:var(--white);
  font-size:clamp(1.1rem,3vh,2.3rem); font-weight:700;
  line-height:1.45; font-family:var(--font-d);
}

/* Opciones */
.q-answers {
  display:flex; flex-direction:column;
  gap:clamp(8px,1.5vh,18px);
}

.ans-btn {
  background:rgba(255,255,255,0.95);
  border:3px solid transparent; border-radius:999px;
  padding: clamp(12px,2.2vh,26px) clamp(18px,3vw,40px);
  font-size:clamp(0.9rem,2.3vh,1.65rem);
  font-weight:500; font-family:var(--font); color:#0d2a24;
  cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:14px; line-height:1.35;
  transition:background .3s, border-color .3s, transform .2s, color .3s, box-shadow .3s;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
  -webkit-tap-highlight-color:transparent;
}
.ans-btn:not(.disabled):hover,
.ans-btn:not(.disabled):active {
  border-color:var(--green);
  transform:translateX(8px);
  box-shadow:0 4px 20px rgba(88,180,110,0.25);
}

.ans-icon {
  font-style:normal; font-size:1.25em;
  min-width:1.5em; text-align:center; flex-shrink:0;
  transition:transform .3s;
}

/* Estados de respuesta */
.ans-btn.is-correct {
  background:var(--correct); color:white; border-color:var(--correct);
  transform:none;
  box-shadow:0 4px 24px rgba(61,191,106,0.45);
}
.ans-btn.is-correct .ans-icon { animation:pop .4s ease; }

.ans-btn.is-wrong {
  background:var(--wrong); color:white; border-color:var(--wrong);
  transform:none;
}
.ans-btn.show-correct {
  background:var(--correct); color:white; border-color:var(--correct);
  animation:reveal .5s ease;
}
.ans-btn.disabled { pointer-events:none; opacity:.65; }

@keyframes pop    { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
@keyframes reveal { 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 100%{transform:translateX(0)} }

/* Banner resultado */
.q-result {
  border-radius:16px;
  padding:clamp(10px,1.8vh,20px) clamp(16px,2.5vw,30px);
  font-size:clamp(0.9rem,2vh,1.5rem); font-weight:700;
  display:none;
  animation:fadeUp .45s cubic-bezier(0.175,0.885,0.32,1.275);
}
.q-result.correct { display:block; background:rgba(61,191,106,0.18); color:#89f7ae; border:2px solid rgba(61,191,106,0.3); }
.q-result.wrong   { display:block; background:rgba(224,82,82,0.18);  color:#ffaaaa; border:2px solid rgba(224,82,82,0.3); }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }

/* Imagen decorativa (abajo derecha) */
.q-deco {
  position:absolute; bottom:0; right:2%;
  width:clamp(80px,17vw,200px);
  pointer-events:none; z-index:0;
}
.q-deco img { display:block; width:100%; height:auto; }

/* Botón Volver — ABAJO IZQUIERDA */
.btn-volver {
  position:absolute; bottom:4%; left:5%;
  background:transparent;
  border:2px solid rgba(255,255,255,0.4); color:white;
  padding:clamp(10px,1.8vh,20px) clamp(22px,3vw,44px);
  border-radius:999px;
  font-size:clamp(0.85rem,1.8vh,1.25rem); font-family:var(--font); font-weight:600;
  cursor:pointer; letter-spacing:0.5px;
  opacity:0; pointer-events:none;
  transition:opacity .4s, background .25s, border-color .25s, transform .2s;
  z-index:10;
  display:flex; align-items:center; gap:8px;
}
.btn-volver.show { opacity:1; pointer-events:all; }
.btn-volver:hover { background:rgba(255,255,255,0.12); border-color:white; transform:translateX(-4px); }
.btn-volver svg   { width:1em; height:1em; flex-shrink:0; }

/* ================================================================
   RESPONSIVE
================================================================ */
/* Pantalla 55" portrait */
@media (min-height:1400px) {
  .wheel-wrap { left:-10%; width:clamp(700px,82vmin,1100px); }
  .tap-hint   { font-size:clamp(1rem,2vh,1.6rem); }
}
/* Desktop landscape */
@media (orientation:landscape) and (min-width:900px) {
  .wheel-wrap { left:3%; }
  .q-answers  { display:grid; grid-template-columns:1fr 1fr; }
}
/* Móvil pequeño */
@media (max-width:380px) {
  .wheel-wrap { left:-25%; width:115vw; }
  .q-content  { padding:8% 6% 22% 6%; }
}

</style>
</head>
<body>

<div id="app">

<!-- ══════════════════════════════════════════════════
     PANTALLA 1 · RULETA
══════════════════════════════════════════════════ -->
<div id="scr-wheel" class="screen">

  <!-- Logo / título (top right) -->
  <div class="logo-wrap">
    <img src="logo_titulo.png" alt="Boehringer Ingelheim">
  </div>

  <!-- Ensamble de la ruleta -->
  <div class="wheel-wrap" id="wheelWrap">

    <!--
      CAPA 1 · GIRA · ruleta.svg
      Esta capa es la que rota con la animación CSS.
      Contiene los 10 segmentos de color y los números.
    -->
    <img id="wheel-spin"
         class="wheel-layer"
         src="ruleta.svg"
         alt=""
         draggable="false">

    <!--
      CAPA 2 · FIJA (encima) · contorno_ruleta.png
      El aro/borde exterior verde. No gira.
    -->
    <img class="wheel-layer"
         src="contorno_ruleta.png"
         alt=""
         draggable="false"
         style="pointer-events:none;">

    <!--
      CAPA 3 · FIJA (encima) · centro_ruleta.png
      El círculo central con el logo BI. No gira.
    -->
    <img class="wheel-layer"
         src="centro_ruleta.png"
         alt=""
         draggable="false"
         style="pointer-events:none;">

    <!--
      PUNTERO · puntero.svg
      Flecha blanca que indica el número ganador.
    -->
    <img class="wheel-pointer"
         src="puntero.svg"
         alt=""
         draggable="false">

  </div><!-- /wheel-wrap -->

  <!-- Mensaje de instrucción -->
  <div class="tap-hint" id="tapHint">
    Toca la ruleta<br>para girar
  </div>

  <!--
    PERRO · video_perro.mp4 + piso_para_video.png
    Video en loop silencioso + piso decorativo debajo.
  -->
  <div class="dog-wrap">
    <video autoplay loop muted playsinline>
      <source src="video_perro.mp4" type="video/mp4">
    </video>
    <img class="dog-floor" src="piso_para_video.png" alt="" draggable="false">
  </div>

</div><!-- /scr-wheel -->


<!-- ══════════════════════════════════════════════════
     PANTALLA 2 · PREGUNTAS
══════════════════════════════════════════════════ -->
<div id="scr-question" class="screen">

  <div class="q-content">

    <!-- Número de pregunta -->
    <div class="q-badge">
      <div class="q-num-circle" id="q-num">1</div>
      <div class="q-label-txt">Pregunta</div>
    </div>

    <!-- Texto -->
    <div class="q-text" id="q-text"></div>

    <!-- Opciones de respuesta -->
    <div class="q-answers" id="q-answers"></div>

    <!-- Banner correcto / incorrecto -->
    <div class="q-result" id="q-result"></div>

  </div>

  <!--
    Imagen decorativa (abajo derecha)
    Cambia automáticamente según la pregunta:
    imagen_decorativa_preguntas-05.png … -09.png
  -->
  <div class="q-deco">
    <img id="q-deco-img" src="imagen_decorativa_preguntas-05.png" alt="">
  </div>

  <!-- Botón Volver (abajo izquierda) -->
  <button class="btn-volver" id="btn-volver" onclick="volverRuleta()">
    <svg viewBox="0 0 16 16" fill="currentColor">
      <path d="M3.86 8.75l4.72 4.72a.75.75 0 1 1-1.06 1.06L1.97 8.97a.75.75 0 0 1 0-1.06l5.55-5.56a.75.75 0 0 1 1.06 1.06L3.86 7.25H14a.75.75 0 0 1 0 1.5H3.86z"/>
    </svg>
    Volver al juego
  </button>

</div><!-- /scr-question -->

</div><!-- /app -->

<script>
'use strict';

/* ================================================================
   DATOS: 10 PREGUNTAS
   Índice 0 = Segmento 1, índice 9 = Segmento 10
================================================================ */
const QUESTIONS = [
  { /* Segmento 1 */
    q: '¿Qué es una vacuna recombinante?',
    opts: [
      'Es una vacuna de virus vivo',
      'Es una vacuna compuesta por proteínas del virus que desencadenan una respuesta inmunitaria',
      'Es una vacuna de virus muerto',
      'Todas las anteriores'
    ],
    correct: 1
  },
  { /* Segmento 2 */
    q: 'Característica correcta del terapéutico Previcox',
    opts: [
      '5 mg/kg',
      'Se puede dar con o sin alimento',
      'Una toma cada 24 hrs',
      'Todas las anteriores'
    ],
    correct: 3
  },
  { /* Segmento 3 */
    q: '¿Qué vector se utiliza para la vacuna C4?',
    opts: [
      'Virus de la Viruela del Canario / Virus Canarypox',
      'Virus de la viruela del mono',
      'Ambas',
      'Ninguna de las anteriores'
    ],
    correct: 0
  },
  { /* Segmento 4 */
    q: '¿Cuál de las siguientes afirmaciones es correcta con respecto a la vacuna Recombitek?',
    opts: [
      'Antígeno recombinante contra moquillo para superar los anticuerpos maternos',
      'No utiliza adyuvantes',
      'Vacuna Recombitek C8 tiene la combinación de 4 serovariedades de Leptospira',
      'Todas las anteriores'
    ],
    correct: 3
  },
  { /* Segmento 5 */
    q: '¿Cómo se llama la molécula que contiene Nexgard?',
    opts: ['Afoxolaner', 'Fluralaner', 'Sarolaner', 'Lotilaner'],
    correct: 0
  },
  { /* Segmento 6 */
    q: '¿Cuál de estas afirmaciones sobre Nexgard es correcta?',
    opts: [
      'Nexgard se puede dar con / sin alimento',
      'Vía de eliminación: más del 99% biliar y menos de 1% renal',
      'Más del 80% de perros prefieren Nexgard Spectra sobre otros productos similares',
      'Todas las anteriores'
    ],
    correct: 3
  },
  { /* Segmento 7 */
    q: '¿Se puede utilizar todos los productos de la familia Nexgard en etapa de gestación y lactación?',
    opts: ['✓  Verdadero', '✗  Falso'],
    correct: 0
  },
  { /* Segmento 8 */
    q: '¿Nexgard Combo es un antiparasitario interno y externo?',
    opts: ['✓  Verdadero', '✗  Falso'],
    correct: 0
  },
  { /* Segmento 9 */
    q: 'Marque la respuesta correcta sobre Nexgard Combo',
    opts: [
      'Desarrollado específicamente para gatos',
      'Seguro en gestantes y lactantes',
      'El antiparasitario de más amplio espectro',
      'Todas las anteriores'
    ],
    correct: 3
  },
  { /* Segmento 10 */
    q: '¿Qué parásitos internos ayuda a controlar NexGard Spectra?',
    opts: [
      'Ascaridios, ancilostómidos y tricúridos',
      'Solo tenias',
      'Solo protozoarios',
      'Ningún parásito intestinal'
    ],
    correct: 0
  }
];

/*
  Imágenes decorativas de la pantalla de preguntas.
  Cicla entre las 5 disponibles para los 10 segmentos:
  Seg 1→05, 2→06, 3→07, 4→08, 5→09, 6→05, 7→06 ...
*/
const DECO_IMGS = [
  'imagen_decorativa_preguntas-05.png',
  'imagen_decorativa_preguntas-06.png',
  'imagen_decorativa_preguntas-07.png',
  'imagen_decorativa_preguntas-08.png',
  'imagen_decorativa_preguntas-09.png',
];

/* ================================================================
   CONFIGURACIÓN DE LA RULETA
================================================================ */
const N_SEG    = 10;           // total de segmentos
const DEG_SEG  = 360 / N_SEG; // 36° por segmento
const PTR_DEG  = 90;           // el puntero está a las 3 en punto (90° desde las 12)
const SPIN_MS  = 4500;         // duración del giro en ms
const PAUSE_MS = 1500;         // pausa tras el giro antes de mostrar pregunta

let spinning = false;
let totalDeg = 0;   // acumula rotación total (para no resetear a 0 entre giros)

/* ================================================================
   SPIN
================================================================ */
function handleWheelClick() {
  if (spinning) return;
  spinning = true;

  // Ocultar hint
  document.getElementById('tapHint').style.opacity = '0';

  // Segmento aleatorio 1–10
  const target = Math.floor(Math.random() * N_SEG) + 1;
  doSpin(target);
}

function doSpin(seg) {
  const el = document.getElementById('wheel-spin');

  /*
    Ángulo del centro del segmento desde las 12 (sentido horario):
    seg=1 → 0°, seg=2 → 36°, ..., seg=10 → 324°
  */
  const segCenter  = (seg - 1) * DEG_SEG;

  /*
    ¿Cuánto hay que rotar para que ese segmento quede bajo el puntero (90°)?
    Ecuación: (segCenter + R) mod 360 = 90  →  R = (90 - segCenter + 360) % 360
  */
  const alignAngle = ((PTR_DEG - segCenter) % 360 + 360) % 360;

  // Delta desde la posición visual actual
  const curMod = totalDeg % 360;
  let   delta  = (alignAngle - curMod + 360) % 360;
  if (delta < 10) delta += 360;  // garantizar al menos algo de giro extra

  const newTotal = totalDeg + 5 * 360 + delta; // 5 vueltas completas + alineación

  el.style.transition = `transform ${SPIN_MS}ms cubic-bezier(0.08, 0.92, 0.18, 1)`;
  el.style.transform  = `rotate(${newTotal}deg)`;
  totalDeg = newTotal;

  // Tras el giro → pausa → mostrar pregunta
  setTimeout(() => {
    setTimeout(() => showQuestion(seg), PAUSE_MS);
  }, SPIN_MS);
}

/* ================================================================
   MOSTRAR PREGUNTA
================================================================ */
function showQuestion(num) {
  const data = QUESTIONS[num - 1];

  // Número y texto
  document.getElementById('q-num').textContent  = num;
  document.getElementById('q-text').textContent = data.q;

  // Imagen decorativa (cicla entre las 5)
  document.getElementById('q-deco-img').src = DECO_IMGS[(num - 1) % 5];

  // Limpiar estado anterior
  const resultEl = document.getElementById('q-result');
  resultEl.className   = 'q-result';
  resultEl.textContent = '';
  document.getElementById('btn-volver').classList.remove('show');

  // Generar botones de respuesta
  const answersEl = document.getElementById('q-answers');
  answersEl.innerHTML = '';

  data.opts.forEach((text, idx) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerHTML = `<em class="ans-icon"></em><span>${text}</span>`;
    btn.addEventListener('click', () => onAnswer(btn, idx, data.correct), { once: true });
    answersEl.appendChild(btn);
  });

  // Deslizar a pantalla de preguntas
  document.getElementById('app').classList.add('show-q');
}

/* ================================================================
   RESPUESTA DEL PARTICIPANTE
================================================================ */
function onAnswer(clickedBtn, selected, correct) {
  // Deshabilitar todos los botones inmediatamente
  const allBtns = [...document.querySelectorAll('.ans-btn')];
  allBtns.forEach(b => b.classList.add('disabled'));

  if (selected === correct) {
    /* ✅ Respuesta correcta */
    clickedBtn.classList.remove('disabled');
    clickedBtn.classList.add('is-correct');
    clickedBtn.querySelector('.ans-icon').textContent = '✓';
    setResult(true);

  } else {
    /* ❌ Respuesta incorrecta */
    clickedBtn.classList.remove('disabled');
    clickedBtn.classList.add('is-wrong');
    clickedBtn.querySelector('.ans-icon').textContent = '✗';

    // Iluminar la respuesta correcta en verde
    const correctBtn = allBtns[correct];
    correctBtn.classList.remove('disabled');
    correctBtn.classList.add('show-correct');
    correctBtn.querySelector('.ans-icon').textContent = '✓';

    setResult(false);
  }

  // Mostrar botón Volver
  document.getElementById('btn-volver').classList.add('show');
}

function setResult(ok) {
  const el = document.getElementById('q-result');
  el.className = ok ? 'q-result correct' : 'q-result wrong';
  el.innerHTML = ok
    ? '🎉 ¡Correcto! Excelente respuesta.'
    : '❌ Incorrecto. La respuesta correcta está marcada en verde.';
}

/* ================================================================
   VOLVER A RULETA
================================================================ */
function volverRuleta() {
  // Deslizar de vuelta
  document.getElementById('app').classList.remove('show-q');

  /*
    Mientras la pantalla de ruleta está fuera de vista (durante la
    animación de slide), la reseteamos silenciosamente para el
    siguiente participante.
  */
  setTimeout(() => {
    const el = document.getElementById('wheel-spin');
    el.style.transition = 'none';
    el.style.transform  = 'rotate(0deg)';
    totalDeg  = 0;
    spinning  = false;
    document.getElementById('tapHint').style.opacity = '1';
  }, 350); // a mitad de la animación de slide (650ms)
}

/* ================================================================
   INIT
================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('wheelWrap');

  // Click (desktop / pantalla táctil)
  wrap.addEventListener('click', handleWheelClick);

  // Touch (previene el doble disparo click+touch)
  wrap.addEventListener('touchend', e => {
    e.preventDefault();
    handleWheelClick();
  }, { passive: false });
});
